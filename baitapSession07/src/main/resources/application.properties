spring.application.name=baitapSession07
spring.config.import=optional:file:../.local-config/baitapSession07.properties,optional:file:./config/application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/recruit_pro_session07}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jackson.deserialization.accept-float-as-int=false
